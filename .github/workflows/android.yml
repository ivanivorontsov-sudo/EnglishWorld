name: Android CI

on:
  push:
    branches: [main, feature/voice-first-b2-tutor]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishWorld-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  publish-signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore owner's signing key
        env:
          KEYSTORE_B64: ${{ secrets.ENGLISHWORLD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Add ENGLISHWORLD_KEYSTORE_BASE64 and the matching signing secrets."; exit 1; }
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 --decode > keystore/englishworld-release.jks
          echo "ENGLISHWORLD_KEYSTORE_FILE=keystore/englishworld-release.jks" >> "$GITHUB_ENV"
      - name: Assemble signed release
        env:
          ENGLISHWORLD_STORE_PASSWORD: ${{ secrets.ENGLISHWORLD_STORE_PASSWORD }}
          ENGLISHWORLD_KEY_ALIAS: ${{ secrets.ENGLISHWORLD_KEY_ALIAS }}
          ENGLISHWORLD_KEY_PASSWORD: ${{ secrets.ENGLISHWORLD_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app-release.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" app-release.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" app-release.sha256 \
              --title "EnglishWorld $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
